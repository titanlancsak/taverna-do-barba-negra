name: CI

# Roda a suíte de testes do backend a cada push e pull request na main.
# Independente do deploy (deploy.yml): aqui não há credenciais nem efeitos
# externos — só instala as dependências e roda os testes.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm install (não npm ci): o sharp traz dependências opcionais específicas
      # por plataforma (variantes @img/sharp-* e emnapi para o fallback wasm). Um
      # package-lock gerado no macOS do dev não casa exatamente com o que o runner
      # Linux precisa, então o npm ci estrito falha; o npm install resolve isso.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Rodar testes
        run: npm test
