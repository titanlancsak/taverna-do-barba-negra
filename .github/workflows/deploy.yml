name: Deploy to AWS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

# Evita deploys simultâneos sobre o mesmo ambiente.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  ECR_REPOSITORY: taverna
  ECS_CLUSTER: taverna
  ECS_SERVICE: taverna
  TASK_FAMILY: taverna
  CONTAINER_NAME: taverna

permissions:
  id-token: write # necessário para o OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push da imagem
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:${{ github.sha }}" -t "$IMAGE_URI:latest" .
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Registrar nova task definition
        id: taskdef
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition' --output json)
          echo "$TASK_DEF" | jq --arg IMG "$IMAGE" \
            '.containerDefinitions[0].image = $IMG
             | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                   .compatibilities, .registeredAt, .registeredBy)' > /tmp/td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$NEW_ARN" >> "$GITHUB_OUTPUT"
          echo "Nova task definition: $NEW_ARN"

      - name: Rodar migrações do banco (task one-off)
        env:
          TD_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          NET=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          SUBNETS=$(echo "$NET" | jq -r '.subnets | join(",")')
          SGS=$(echo "$NET" | jq -r '.securityGroups | join(",")')
          ASSIGN=$(echo "$NET" | jq -r '.assignPublicIp')

          TASK_ARN=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$TD_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SGS],assignPublicIp=$ASSIGN}" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER_NAME\",\"command\":[\"node\",\"db/migrate.js\"]}]}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Task de migração: $TASK_ARN"

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Exit code da migração: $EXIT"
          if [ "$EXIT" != "0" ]; then
            echo "::error::Migração falhou (exit $EXIT). Deploy abortado."
            exit 1
          fi

      - name: Atualizar o service ECS
        env:
          TD_ARN: ${{ steps.taskdef.outputs.arn }}
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$TD_ARN" >/dev/null
          echo "Aguardando o service estabilizar..."
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
          echo "Deploy concluído."
