<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイプロフィール - Blackbeard Tavern</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
  <header>
    <h1></h1>
  </header>

  <main class="profile-page">
    <h2>マイプロフィール</h2>

    <div id="profile-picture-section">
      <img id="profile-preview" src="../assets/profile-pictures/default.png" alt="プロフィール写真" width="120" height="120" style="border-radius: 50%; object-fit: cover;">
      <label for="picture-input">Picture Input</label>
      <input type="file" id="picture-input" accept="image/png, image/jpeg, image/webp">
      <div id="picture-buttons">
        <button id="upload-picture-btn">写真をアップロード</button>
        <button id="remove-picture-btn" type="button">写真を削除</button>
      </div>
    </div>

    <form id="profile-form">
      <label for="display-name-input">表示名</label>
      <input type="text" id="display-name-input" maxlength="50" placeholder="他のユーザーに表示される名前">

      <label>
        <input type="checkbox" id="anonymous-checkbox">
        匿名のままにする（他のユーザーに名前を表示しない）
      </label>

      <label for="course-input">コース</label>
      <input type="text" id="course-input" maxlength="100" placeholder="例：情報技術">

      <label for="gender-select">性別</label>
      <select id="gender-select">
        <option value="">回答しない</option>
        <option value="Male">男性</option>
        <option value="Female">女性</option>
        <option value="Other">その他</option>
      </select>

      <button type="submit">プロフィールを保存</button>
    </form>

    <p id="status-message"></p>

    <section id="danger-zone">
      <h3>アカウントの削除</h3>
      <p>アカウントを削除すると、投稿・メッセージ・フレンドなど、すべてのデータが完全に削除されます。この操作は取り消せません。</p>
      <button id="delete-account-btn" type="button">アカウントを削除</button>

      <div id="delete-confirm" style="display:none;">
        <p>確認のため、現在のパスワードを入力してください。</p>
        <input type="password" id="delete-password" placeholder="パスワード" autocomplete="current-password">
        <div id="delete-confirm-actions">
          <button id="delete-cancel-btn" type="button">キャンセル</button>
          <button id="delete-confirm-btn" type="button">完全に削除する</button>
        </div>
      </div>
      <p id="delete-status"></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Blackbeard Tavern</p>
  </footer>

  <script src="../js/session.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
