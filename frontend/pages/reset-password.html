<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新しいパスワード - Blackbeard Tavern</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/tools.css">
</head>
<body>
  <header>
    <h1></h1>
  </header>

  <main>
    <h2>新しいパスワードを設定</h2>

    <form id="reset-form">
      <input type="password" id="password-input" placeholder="新しいパスワード（8文字以上）" minlength="8" required>
      <input type="password" id="password-confirm" placeholder="新しいパスワード（確認）" minlength="8" required>
      <button type="submit">パスワードを再設定</button>
    </form>

    <p id="status-message"></p>

    <p class="auth-links"><a href="login.html" id="login-link" style="display:none;">ログインへ</a></p>
  </main>

  <footer>
    <p>&copy; 2026 Blackbeard Tavern</p>
  </footer>

  <script src="../js/reset-password.js"></script>
  <script src="../js/session.js"></script>
</body>
</html>
